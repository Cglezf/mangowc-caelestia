[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caelestia"
description = "MangoWC port of the Caelestia main control script"
requires-python = ">=3.13"
version = "2.0.0"
dependencies = [
    "pillow",
    "materialyoucolor"
]

[project.scripts]
caelestia = "caelestia:main"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "completions",
    "README.md"
]

[tool.ruff]
line-length = 120
