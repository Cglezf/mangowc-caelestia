# Caelestia para MangoWC (mangowc-caelestia: paquetes mangowc-caelestia-shell y
# mangowc-caelestia-cli, de packaging/arch/PKGBUILD).
# Se carga desde config.conf con `source-optional = ./caelestia.conf`.
# En mango gana el PRIMER bind que coincide: si este archivo se carga después
# de otros binds, los que choquen quedan inertes sin aviso.
# `spawn` no pasa por un shell: todo comando con `;`, `||` o `$(...)` va con
# `spawn_shell`.

# --- Arranque ---
exec-once = caelestia-shell -d

# --- Capas: el shell dibuja su propio desenfoque ---
layerrule = noblur:1,layer_name:caelestia

# ==========================================
# Binds del port de Ackerman-00 (github.com/Ackerman-00/caelestia-shell-mango,
# README, mango_bind.conf). Van antes que el bloque del README para ganar en
# las teclas que comparten. Corregidos dos de su README que no separaban la
# tecla con coma (SUPER+p y SUPER+l).
# ==========================================
# Lanzador
bind = SUPER,a,spawn_shell,caelestia-shell ipc call drawers toggle launcher
# Portapapeles
bind = SUPER,v,spawn_shell,caelestia-shell ipc call clipboard open
# Centro de control
bind = SUPER,comma,spawn_shell,caelestia-shell ipc call controlCenter open
# Menú de fondos
bind = SUPER,w,spawn_shell,caelestia-shell ipc call wallpaper openMenu
# Fondo al azar
bind = CTRL+ALT,w,spawn_shell,caelestia-shell ipc call wallpaper random
# Panel principal
bind = SUPER,p,spawn_shell,caelestia-shell ipc call drawers toggle dashboard
# Bloquear
bind = SUPER,l,spawn_shell,caelestia-shell ipc call lock lock
# Captura de región
bind = SUPER+SHIFT,Print,spawn_shell,caelestia-shell ipc call picker open
# Empezar a grabar
bind = CTRL+ALT,u,spawn_shell,caelestia-shell ipc call record start
# Pausar la grabación
bind = CTRL+ALT,p,spawn_shell,caelestia-shell ipc call record togglePause
# Detener la grabación
bind = CTRL+ALT,s,spawn_shell,caelestia-shell ipc call record stop
# Menú de sesión
bind = CTRL+ALT,Delete,spawn_shell,caelestia-shell ipc call drawers toggle session
# Subir volumen
bind = NONE,XF86AudioRaiseVolume,spawn_shell,caelestia-shell ipc call audio set 5%+
# Bajar volumen
bind = NONE,XF86AudioLowerVolume,spawn_shell,caelestia-shell ipc call audio set 5%-
# Silenciar
bind = NONE,XF86AudioMute,spawn_shell,caelestia-shell ipc call audio mute

# --- Micrófono y brillo por tecla de función (el volumen va arriba, por IPC) ---
# El IPC de audio no trae el micrófono: wpctl.
# Silenciar micrófono
bind = NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Por IPC para que el shell pinte su OSD (services/Brightness.qml: gramática de brightnessctl).
# Subir brillo
bind = NONE,XF86MonBrightnessUp,spawn,caelestia-shell ipc call brightness set +5%
# Bajar brillo
bind = NONE,XF86MonBrightnessDown,spawn,caelestia-shell ipc call brightness set 5%-
# Reproducir o pausar
bind = NONE,XF86AudioPlay,spawn,caelestia-shell ipc call mpris playPause
# Siguiente pista
bind = NONE,XF86AudioNext,spawn,caelestia-shell ipc call mpris next
# Pista anterior
bind = NONE,XF86AudioPrev,spawn,caelestia-shell ipc call mpris previous
# Detener
bind = NONE,XF86AudioStop,spawn,caelestia-shell ipc call mpris stop

# ==========================================
# Binds del README (sección «Default keybinds»), traducidos a mango.
# Sin equivalente en mango, y por eso fuera: grupos de ventanas, grupos de
# espacios (Ctrl+Super+N), el espacio especial y los de sysmon, música,
# comunicación y todo, imagen en imagen, y «redimensionar al 55x70 % y centrar».
# El lanzador va en Super+Espacio: no está medido que mango dispare un bind
# al soltar Super solo.
# ==========================================

# --- Lanzador ---
# Abrir el lanzador
bind = SUPER,space,spawn,caelestia-shell ipc call drawers toggle launcher

# --- Espacios (mango tiene 9 etiquetas: no hay 10) ---
# Ir al espacio 1
bind = SUPER,1,view,1,0
# Ir al espacio 2
bind = SUPER,2,view,2,0
# Ir al espacio 3
bind = SUPER,3,view,3,0
# Ir al espacio 4
bind = SUPER,4,view,4,0
# Ir al espacio 5
bind = SUPER,5,view,5,0
# Ir al espacio 6
bind = SUPER,6,view,6,0
# Ir al espacio 7
bind = SUPER,7,view,7,0
# Ir al espacio 8
bind = SUPER,8,view,8,0
# Ir al espacio 9
bind = SUPER,9,view,9,0
# Mover la ventana al espacio 1
bind = SUPER+ALT,1,tag,1,0
# Mover la ventana al espacio 2
bind = SUPER+ALT,2,tag,2,0
# Mover la ventana al espacio 3
bind = SUPER+ALT,3,tag,3,0
# Mover la ventana al espacio 4
bind = SUPER+ALT,4,tag,4,0
# Mover la ventana al espacio 5
bind = SUPER+ALT,5,tag,5,0
# Mover la ventana al espacio 6
bind = SUPER+ALT,6,tag,6,0
# Mover la ventana al espacio 7
bind = SUPER+ALT,7,tag,7,0
# Mover la ventana al espacio 8
bind = SUPER+ALT,8,tag,8,0
# Mover la ventana al espacio 9
bind = SUPER+ALT,9,tag,9,0
# Ir al espacio siguiente
bind = SUPER,Page_Down,viewtoright,0
# Ir al espacio siguiente
bind = CTRL+SUPER,Right,viewtoright,0
# Ir al espacio anterior
bind = SUPER,Page_Up,viewtoleft,0
# Ir al espacio anterior
bind = CTRL+SUPER,Left,viewtoleft,0
# Mover la ventana al espacio siguiente
bind = SUPER+ALT,Page_Down,tagtoright,0
# Mover la ventana al espacio siguiente
bind = CTRL+SUPER+SHIFT,Right,tagtoright,0
# Mover la ventana al espacio anterior
bind = SUPER+ALT,Page_Up,tagtoleft,0
# Mover la ventana al espacio anterior
bind = CTRL+SUPER+SHIFT,Left,tagtoleft,0
axisbind = SUPER,DOWN,viewtoright,0
axisbind = SUPER,UP,viewtoleft,0
axisbind = SUPER+ALT,DOWN,tagtoright,0
axisbind = SUPER+ALT,UP,tagtoleft,0

# --- Ventanas: ciclo (sustituye a los grupos) ---
# Ventana siguiente
bind = ALT,Tab,focusstack,next
# Ventana anterior
bind = SHIFT+ALT,Tab,focusstack,prev

# --- Acciones de ventana ---
# Estrechar
bind = SUPER,minus,resizewin,-50,+0
# Estrechar
bind = SUPER+ALT,Left,resizewin,-50,+0
# Ensanchar
bind = SUPER,equal,resizewin,+50,+0
# Ensanchar
bind = SUPER+ALT,Right,resizewin,+50,+0
# Acortar
bind = SUPER+SHIFT,minus,resizewin,+0,-50
# Acortar
bind = SUPER+ALT,Up,resizewin,+0,-50
# Alargar
bind = SUPER+SHIFT,equal,resizewin,+0,+50
# Alargar
bind = SUPER+ALT,Down,resizewin,+0,+50
# Foco a la izquierda
bind = SUPER,Left,focusdir,left
# Foco a la derecha
bind = SUPER,Right,focusdir,right
# Foco arriba
bind = SUPER,Up,focusdir,up
# Foco abajo
bind = SUPER,Down,focusdir,down
# Mover ventana a la izquierda
bind = SUPER+SHIFT,Left,exchange_client,left
# Mover ventana a la derecha
bind = SUPER+SHIFT,Right,exchange_client,right
# Mover ventana arriba
bind = SUPER+SHIFT,Up,exchange_client,up
# Mover ventana abajo
bind = SUPER+SHIFT,Down,exchange_client,down
mousebind = SUPER,btn_left,moveresize,curmove
mousebind = SUPER,btn_right,moveresize,curresize
# Centrar ventana
bind = CTRL+SUPER,backslash,centerwin
# Fijar en todos los espacios
bind = SUPER+SHIFT,p,toggleglobal
# Pantalla completa
bind = SUPER,f,togglefullscreen
# Maximizar
bind = SUPER+ALT,f,togglemaximizescreen
# Flotante
bind = SUPER+ALT,space,togglefloating
# Cerrar ventana
bind = SUPER,q,killclient

# --- Espacio especial (en mango, el scratchpad) ---
# Mostrar u ocultar el scratchpad
bind = SUPER,s,toggle_scratchpad

# --- Aplicaciones ---
# Terminal
bind = SUPER,t,spawn,foot
# Navegador
bind = SUPER+SHIFT,w,spawn,firefox
# Editor
bind = SUPER,c,spawn,codium
# Archivos
bind = SUPER,e,spawn,thunar
# Audio
bind = CTRL+ALT,v,spawn,pwvucontrol

# --- Utilidades ---
# Captura de pantalla
bind = NONE,Print,spawn,caelestia screenshot
# Captura congelada
bind = SUPER+SHIFT,s,spawn,caelestia-shell ipc call picker openFreeze
# Captura de región
bind = SUPER+SHIFT+ALT,s,spawn,caelestia-shell ipc call picker open
# Grabar pantalla (el port declara la grabación deshabilitada)
bind = CTRL+ALT,r,spawn,caelestia record
# Grabar con sonido
bind = SUPER+ALT,r,spawn,caelestia record -s
# Grabar región
bind = SUPER+SHIFT+ALT,r,spawn,caelestia record -r
# Selector de color
bind = SUPER+SHIFT,c,spawn,hyprpicker -a

# --- Multimedia ---
# Reproducir o pausar
bind = CTRL+SUPER,space,spawn,caelestia-shell ipc call mpris playPause
# Siguiente pista
bind = CTRL+SUPER,equal,spawn,caelestia-shell ipc call mpris next
# Pista anterior
bind = CTRL+SUPER,minus,spawn,caelestia-shell ipc call mpris previous
# Detener
bind = CTRL+SUPER,BackSpace,spawn,caelestia-shell ipc call mpris stop
# Silenciar
bind = SUPER+SHIFT,m,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Varios ---
# Barra lateral
bind = SUPER,n,spawn,caelestia-shell ipc call drawers toggle sidebar
# Limpiar notificaciones
bind = CTRL+ALT,c,spawn,caelestia-shell ipc call notifs clear
# Paneles (el port no expone «showall»: abre el panel principal)
bind = SUPER,k,spawn,caelestia-shell ipc call drawers toggle dashboard
# Restaurar el bloqueo del shell
bind = SUPER+ALT,l,spawn_shell,caelestia-shell -d; sleep 1; caelestia-shell ipc call lock lock
# Suspender
bind = SUPER+SHIFT,l,spawn,systemctl suspend-then-hibernate

# --- Portapapeles y emoji ---
# Historial (modo borrar)
bind = SUPER+ALT,v,spawn_shell,pkill fuzzel || caelestia clipboard -d
# Pegar lo último copiado
bind = CTRL+SHIFT+ALT,v,spawn_shell,sleep 0.5s && ydotool type -d 1 "$(cliphist list | head -1 | cliphist decode)"
# Selector de emoji
bind = SUPER,period,spawn_shell,pkill fuzzel || caelestia emoji -p

# --- Shell ---
# Reiniciar el shell
bind = CTRL+SUPER+ALT,r,spawn_shell,caelestia-shell kill; sleep .1; caelestia-shell -d
# Matar el shell
bind = CTRL+SUPER+SHIFT,r,spawn,caelestia-shell kill
